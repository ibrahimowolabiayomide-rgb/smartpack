# Local development database only. The applications run on your machine with pnpm, not in
# containers. Docker is optional: docs/DATABASE_SETUP.md explains how to use a native PostgreSQL
# install instead.
#
#   docker compose up -d db      start PostgreSQL 16 with PostGIS
#   docker compose down          stop it (data is kept in the named volume)
#   docker compose down -v       stop it AND delete all local data
#
# The credentials below are for local development only. They are bound to 127.0.0.1, so they are
# not reachable from other machines. Never reuse them anywhere else.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: smartpack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project root .env file}
      POSTGRES_DB: smartpack_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - smartpack-db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartpack -d smartpack_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartpack-db-data:
