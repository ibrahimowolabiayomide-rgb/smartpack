name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. It uses no secrets.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: smartpack
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: smartpack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartpack -d smartpack_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway database inside the job's own service container.
      TEST_DATABASE_URL: postgresql://smartpack:ci_only_password@localhost:5432/smartpack_ci
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_SSL: disable

      - name: Integration tests (API against PostgreSQL)
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm --filter @smartpack/web exec playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: pnpm test:e2e:full

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
